plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lunar.desktop'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lunar.desktop'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-29'
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it can be sideloaded straight away (SideQuest / adb).
            signingConfig signingConfigs.debug
        }
        debug {
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
